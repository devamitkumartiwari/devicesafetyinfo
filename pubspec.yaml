name: device_safety_info
description: Device security toolkit for Flutter - root/jailbreak, hook, and debugger detection, screenshot and clipboard protection, overlay-attack defenses, VPN and update checks.
version: 1.5.1
homepage: https://github.com/devamitkumartiwari/devicesafetyinfo
repository: https://github.com/devamitkumartiwari/devicesafetyinfo
issue_tracker: https://github.com/devamitkumartiwari/devicesafetyinfo/issues

topics:
  - security
  - root-detection
  - jailbreak-detection
  - privacy
  - device-integrity

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any



flutter:

  plugin:
    platforms:
      android:
        package: com.devamitkumartiwari.device_safety_info
        pluginClass: DeviceSafetyInfoPlugin
        ffiPlugin: true
      ios:
        pluginClass: DeviceSafetyInfoPlugin
        ffiPlugin: true
