name: device_safety_info
description: Device Safety Info Flutter Plugin used for checking JailBreak, Rooted Device, Emulator/Simulator, External storage, VPN Detector, Application Update Checker and Screen Lock.
version: 1.2.0
homepage: https://github.com/devamitkumartiwari/devicesafetyinfo
repository: https://github.com/devamitkumartiwari/devicesafetyinfo
issue_tracker: https://github.com/devamitkumartiwari/devicesafetyinfo/issues

topics:
  - security
  - rooted
  - jailbreak
  - safety
  - anti-fraud

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  connectivity_plus: ^7.1.1
  package_info_plus: ^10.1.0
  http: ^1.6.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any



flutter:

  plugin:
    platforms:
      android:
        package: com.devamitkumartiwari.device_safety_info
        pluginClass: DeviceSafetyInfoPlugin
        ffiPlugin: true
      ios:
        pluginClass: DeviceSafetyInfoPlugin
        ffiPlugin: true
