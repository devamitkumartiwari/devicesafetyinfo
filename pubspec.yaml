name: device_safety_info
description: Flutter device security - root/jailbreak, hook and debugger detection, Play Integrity and App Attest tokens, screenshot and clipboard protection, VPN checks.
version: 2.0.0
homepage: https://github.com/devamitkumartiwari/devicesafetyinfo
repository: https://github.com/devamitkumartiwari/devicesafetyinfo
issue_tracker: https://github.com/devamitkumartiwari/devicesafetyinfo/issues

topics:
  - security
  - root-detection
  - jailbreak-detection
  - privacy
  - device-integrity

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.6
  code_assets: ^2.2.0
  logging: ^1.3.0
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^30.0.4
  ffigen: ^23.0.0
  skills_lint: ^0.5.3+1

flutter:

  plugin:
    platforms:
      android:
        package: com.devamitkumartiwari.device_safety_info
        pluginClass: DeviceSafetyInfoPlugin
      ios:
        pluginClass: DeviceSafetyInfoPlugin
